<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    font-size: 13px; 
    color: #1e293b; 
    padding: 20px; 
    background-color: #F1F1F3;
    line-height: 1.5;
  }
  h2 { 
    font-size: 18px; 
    font-weight: 700; 
    margin-bottom: 16px; 
    color: #000077;
    border-bottom: 2px solid #cbd5e1;
    padding-bottom: 8px;
  }
  h3 { 
    font-size: 11px; 
    font-weight: 700; 
    color: #475569; 
    margin: 12px 0 6px; 
    text-transform: uppercase; 
    letter-spacing: 0.05em; 
  }
  .row { display: flex; gap: 12px; margin-bottom: 12px; }
  .row > * { flex: 1; }
  label { 
    display: block; 
    font-size: 11px; 
    font-weight: 600; 
    color: #475569; 
    margin-bottom: 6px; 
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  select, input, textarea { 
    width: 100%; 
    padding: 8px 12px; 
    border: 1px solid #cbd5e1; 
    border-radius: 8px; 
    font-size: 13px; 
    font-family: inherit;
    background: #fff;
    color: #0f172a;
    transition: all 0.2s ease;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }
  select:focus, input:focus, textarea:focus { 
    outline: none; 
    border-color: #000077; 
    box-shadow: 0 0 0 3px rgba(0, 0, 119, 0.15);
  }
  textarea { min-height: 65px; resize: vertical; }
  button { 
    padding: 9px 16px; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 13px; 
    font-weight: 600; 
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }
  button:hover {
    transform: translateY(-1px);
  }
  button:active {
    transform: translateY(0);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-primary { 
    background: #000077; 
    color: #fff; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 119, 0.2);
  }
  .btn-primary:hover { background: #000055; }
  .btn-danger { 
    background: #fee2e2; 
    color: #991b1b; 
    border: 1px solid #fca5a5;
  }
  .btn-danger:hover { background: #fecaca; }
  .btn-secondary { 
    background: #fff; 
    color: #475569; 
    border: 1px solid #cbd5e1;
  }
  .btn-secondary:hover { background: #f8fafc; }
  .action-card { 
    border: 1px solid #cbd5e1; 
    border-radius: 10px; 
    padding: 16px; 
    margin-bottom: 12px; 
    background: #fff; 
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
  }
  .action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
  .action-title { font-weight: 700; font-size: 14px; color: #0f172a; }
  .kind-badge { font-size: 10px; padding: 3px 8px; border-radius: 12px; margin-left: 8px; font-weight: 600; text-transform: uppercase; }
  .kind-badge.mutate { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .kind-badge.navigate { background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; }
  .field-row, .cond-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .field-row input, .cond-row input { flex: 1; }
  .field-row select { width: 120px; }
  .cond-row select { width: 130px; }
  .field-row .remove-field, .cond-row .remove-cond { cursor: pointer; color: #ef4444; font-size: 18px; padding: 2px 6px; font-weight: bold; transition: color 0.2s; }
  .field-row .remove-field:hover, .cond-row .remove-cond:hover { color: #b91c1c; }
  .no-actions { color: #64748b; text-align: center; padding: 32px; font-size: 14px; background: #fff; border-radius: 8px; border: 1px solid #cbd5e1; }
  .status-bar { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; font-weight: 500; font-size: 12px; border: 1px solid transparent; }
  .status-bar.error { display: block; background: #fef2f2; color: #991b1b; border-color: #fca5a5; }
  .status-bar.success { display: block; background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
  .actions-toolbar { display: flex; gap: 8px; margin-bottom: 16px; justify-content: space-between; align-items: center; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; font-size: 13px; }
  .checkbox-row input[type=checkbox] { width: auto; box-shadow: none; cursor: pointer; }
  .sub-section { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 12px; margin-top: 12px; }
  .hint { font-size: 11px; color: #64748b; margin-top: 4px; }
  .hint code { background: #e2e8f0; padding: 1px 4px; border-radius: 3px; font-size: 10px; }

  /* ── Targets ─────────────────────────────────────────────────────────── */
  .target-card { border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; margin-top: 8px; background: #fff; }
  .target-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .target-title { font-size: 12px; font-weight: 700; color: #0f172a; }
  .target-title .mode-badge { font-size: 9px; padding: 2px 7px; border-radius: 10px; margin-left: 6px; font-weight: 600; text-transform: uppercase; background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }
  /* 7 columns: name, label, type, required, from, value, remove. A label strip
     above the rows keeps six narrow inputs readable without per-input labels. */
  .tf-row, .tf-head { display: grid; grid-template-columns: 1.1fr 1.1fr 108px 44px 1.2fr 1.2fr 20px; gap: 6px; align-items: center; }
  .tf-row { margin-top: 5px; }
  .tf-head { margin-top: 8px; font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
  .tf-row .remove-field { cursor: pointer; color: #ef4444; font-size: 17px; font-weight: bold; text-align: center; }
  .tf-row .remove-field:hover { color: #b91c1c; }
  .tf-row input[type=checkbox] { width: auto; margin: 0 auto; display: block; box-shadow: none; cursor: pointer; }
  /* Second line for select option sourcing — only rendered for select fields. */
  .opt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; padding-left: 4px; border-left: 2px solid #e2e8f0; }

  /* Custom scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: #f1f5f9;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }
</style>
</head>
<body>

<div id="status" class="status-bar"></div>

<div class="row">
  <div>
    <label>Resource</label>
    <select id="resourceSelect" onchange="onResourceChange()">
      <option value="">-- Select Resource --</option>
    </select>
  </div>
</div>

<div class="actions-toolbar">
  <h2 id="actionsTitle">Actions</h2>
  <button class="btn-primary" onclick="addAction()" id="addBtn" disabled>+ Add Action</button>
</div>

<div id="actionsList"></div>

<div style="margin-top:16px; display:flex; gap:8px; justify-content:flex-end;">
  <button class="btn-secondary" onclick="google.script.host.close()">Close</button>
  <button class="btn-primary" onclick="saveActions()" id="saveBtn" disabled>Save Actions</button>
</div>

<script>
var resourceData = [];
var currentActions = [];
// A TARGET's `when` gate. Deliberately the narrow set: the SERVER
// (`evaluateActionTargetCondition` in GAS/actionTargets.gs) is the authority on
// targets and understands only these six.
var VALID_OPS = ['eq','ne','in','nin','empty','notEmpty'];

// `visibleWhen` is evaluated CLIENT-side by FRONTENT/src/utils/tokenEvaluator.js,
// which offers the full comparison grammar. `ne` / `nin` are the spellings this
// editor wrote before the list was standardised — OP_ALIASES folds them onto the
// canonical names on load, so a saved schema opens on the right option and is
// rewritten canonically on the next save. The evaluator aliases them too, so an
// untouched config keeps working either way.
var VISIBLE_WHEN_OPS = ['eq','neq','in','not_in','gt','gte','lt','lte','contains','empty','notEmpty'];
var OP_ALIASES = { ne: 'neq', nin: 'not_in' };

function normalizeOp(op) {
  return OP_ALIASES[op] || op;
}

function isListOp(op) { return op === 'in' || op === 'not_in' || op === 'nin'; }
function isEmptyOp(op) { return op === 'empty' || op === 'notEmpty'; }

// Mirrors TOKENS in FRONTENT/src/utils/tokenEvaluator.js and the copy in
// GAS/listViewsManager.html — keep all three in sync.
// `param` tokens take a value after a colon, e.g. $daysIn:30.
var TOKENS = [
  { code: '$now', label: 'Now (timestamp)', group: 'Date & Time' },
  { code: '$date', label: 'Date (YYYY-MM-DD)', group: 'Date & Time', param: '0' },
  { code: '$day', label: 'Day of year (1-366)', group: 'Date & Time' },
  { code: '$month', label: 'Month (01-12)', group: 'Date & Time', param: '0' },
  { code: '$year', label: 'Current year (YYYY)', group: 'Date & Time' },
  { code: '$week', label: 'Current ISO week (1-53)', group: 'Date & Time' },
  { code: '$startOfDay', label: 'Start of day (timestamp)', group: 'Date & Time', param: '0' },
  { code: '$endOfDay', label: 'End of day (timestamp)', group: 'Date & Time', param: '0' },
  { code: '$startOfMonth', label: 'Start of month (timestamp)', group: 'Date & Time', param: '0' },
  { code: '$endOfMonth', label: 'End of month (timestamp)', group: 'Date & Time', param: '0' },

  { code: '$daysAgo', label: 'N days ago', group: 'Relative Days', param: '7' },
  { code: '$daysIn', label: 'In N days', group: 'Relative Days', param: '30' },

  { code: '$userCode', label: 'My user code', group: 'Current User' },
  { code: '$userEmail', label: 'My email', group: 'Current User' },
  { code: '$userName', label: 'My name', group: 'Current User' },
  { code: '$userDesignation', label: 'My designation', group: 'Current User' },
  { code: '$userRole', label: 'My primary role', group: 'Current User' },
  { code: '$userRoles', label: 'My roles (list)', group: 'Current User', list: true },
  { code: '$userRegion', label: 'My region code', group: 'Current User' },
  { code: '$userRegions', label: 'My accessible regions (list)', group: 'Current User', list: true }
];

/**
 * Builds the token <select> markup, grouped by TOKENS[].group.
 * `selectedVal` is the current condition value, which for a param token looks like "$daysIn:30".
 */
function buildTokenOptions(selectedVal) {
  var currentCode = (selectedVal || '').split(':')[0];
  var groups = [];
  var byGroup = {};

  TOKENS.forEach(function(t) {
    if (!byGroup[t.group]) { byGroup[t.group] = []; groups.push(t.group); }
    byGroup[t.group].push(t);
  });

  return '<option value="">Token...</option>' + groups.map(function(g) {
    return '<optgroup label="' + esc(g) + '">' + byGroup[g].map(function(t) {
      var sel = (currentCode === t.code) ? ' selected' : '';
      return '<option value="' + t.code + '"' + sel + '>' + esc(t.label) + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
}
// Mirrors the folders under FRONTENT/src/components/_fields/. Every action input
// renders through that resolver, so anything with a folder there is authorable
// here. An unknown type degrades to `text` rather than failing to render.
var FIELD_TYPES = ['text','textarea','number','date','select','currency','file','link','tel','toggle','status'];
var NAV_TARGETS = ['record-page','list','view','edit','add','action'];
var TARGET_MODES = ['create','update'];

google.script.run.withSuccessHandler(function(data) {
  resourceData = data.resources || [];
  var sel = document.getElementById('resourceSelect');
  resourceData.forEach(function(r) {
    var opt = document.createElement('option');
    opt.value = r.name;
    opt.textContent = r.label + ' (' + r.name + ')';
    sel.appendChild(opt);
  });
}).withFailureHandler(function(err) {
  showStatus('Failed to load: ' + err.message, 'error');
}).app_getActionManagerData();

function onResourceChange() {
  var name = document.getElementById('resourceSelect').value;
  document.getElementById('addBtn').disabled = !name;
  document.getElementById('saveBtn').disabled = !name;
  if (!name) { currentActions = []; renderActions(); return; }

  var res = resourceData.find(function(r) { return r.name === name; });
  var raw = res ? (res.additionalActions || []) : [];
  currentActions = JSON.parse(JSON.stringify(raw)).map(normalizeForEdit);
  renderActions();
}

function normalizeForEdit(a) {
  a.kind = (a.kind === 'navigate') ? 'navigate' : 'mutate';
  if (a.kind === 'mutate') {
    a.column = a.column || 'Progress';
    a.columnValue = a.columnValue || '';
    if (!Array.isArray(a.columnValueOptions)) a.columnValueOptions = [];
    if (!Array.isArray(a.fields)) a.fields = [];
    if (!Array.isArray(a.targets)) a.targets = [];
    a.targets.forEach(function(t) {
      t.mode = (t.mode === 'update') ? 'update' : 'create';
      t.resource = t.resource || '';
      t.key = t.key || '';
      t.label = t.label || '';
      t.code = t.code || '';
      if (!Array.isArray(t.fields)) t.fields = [];
      // `when` normalizes into array form for the editor exactly as visibleWhen
      // does; the serializer collapses a single condition back to an object.
      if (t.when == null) t.when = [];
      else if (!Array.isArray(t.when)) t.when = [t.when];
    });
  } else {
    a.navigate = a.navigate || {};
    a.navigate.target = a.navigate.target || 'record-page';
    a.navigate.pageSlug = a.navigate.pageSlug || '';
    a.navigate.resourceSlug = a.navigate.resourceSlug || '';
    a.navigate.scope = a.navigate.scope || '';
  }
  // Normalize visibleWhen into array form for the editor, canonicalising the
  // legacy `ne` / `nin` spellings so a saved schema opens on the right option.
  if (a.visibleWhen == null) {
    a.visibleWhen = [];
  } else if (!Array.isArray(a.visibleWhen)) {
    a.visibleWhen = [a.visibleWhen];
  }
  a.visibleWhen.forEach(function(c) { if (c) c.op = normalizeOp(c.op); });
  return a;
}

function addAction() {
  currentActions.push({
    action: '', label: '', icon: '', color: 'primary',
    kind: 'mutate',
    column: 'Progress', columnValue: '', columnValueOptions: [],
    confirm: false, fields: [], targets: [],
    visibleWhen: []
  });
  renderActions();
}
function removeAction(idx) { currentActions.splice(idx, 1); renderActions(); }
function addField(i) { currentActions[i].fields.push({ name: '', type: 'text', label: '', required: false }); renderActions(); }
function removeField(i, fi) { currentActions[i].fields.splice(fi, 1); renderActions(); }

// A type change re-renders because the select/option-sourcing inputs are
// conditional on it. Safe for focus: `change` on a <select> fires after the user
// has already committed the choice.
function onFieldTypeChange(i, fi, val) { currentActions[i].fields[fi].type = val; renderActions(); }
function onTargetFieldTypeChange(i, ti, fi, val) { currentActions[i].targets[ti].fields[fi].type = val; renderActions(); }
function onTargetModeChange(i, ti, val) { currentActions[i].targets[ti].mode = val; renderActions(); }

function addTarget(i) {
  currentActions[i].targets.push({ resource: '', mode: 'create', key: '', label: '', code: '', fields: [], when: [] });
  renderActions();
}
function removeTarget(i, ti) { currentActions[i].targets.splice(ti, 1); renderActions(); }
function addTargetField(i, ti) {
  currentActions[i].targets[ti].fields.push({ name: '', label: '', type: '', required: false, from: '', value: '' });
  renderActions();
}
function removeTargetField(i, ti, fi) { currentActions[i].targets[ti].fields.splice(fi, 1); renderActions(); }
function addCondition(i) { currentActions[i].visibleWhen.push({ column: '', op: 'eq', value: '' }); renderActions(); }
function removeCondition(i, ci) { currentActions[i].visibleWhen.splice(ci, 1); renderActions(); }

// ── Target `when` gate ────────────────────────────────────────────────────────
// Same condition grammar as visibleWhen, plus a left-operand SOURCE: `field`
// reads this target's own input, `column` the source record, `expression` any
// from/value expression. Exactly one is stored, which is why switching source
// moves the operand across rather than adding a second key.
var WHEN_SOURCES = ['field', 'column', 'expression'];

function whenSourceOf(c) {
  if (!c) return 'field';
  for (var s = 0; s < WHEN_SOURCES.length; s++) {
    if (c[WHEN_SOURCES[s]] !== undefined) return WHEN_SOURCES[s];
  }
  return 'field';
}

function whenOperandOf(c) {
  var key = whenSourceOf(c);
  return (c && c[key] != null) ? c[key] : '';
}

function targetWhenAt(i, ti, ci) { return currentActions[i].targets[ti].when[ci]; }

function addTargetCondition(i, ti) {
  var t = currentActions[i].targets[ti];
  if (!Array.isArray(t.when)) t.when = [];
  t.when.push({ field: '', op: 'notEmpty', value: '' });
  renderActions();
}
function removeTargetCondition(i, ti, ci) { currentActions[i].targets[ti].when.splice(ci, 1); renderActions(); }

function onTargetWhenSourceChange(i, ti, ci, source) {
  var c = targetWhenAt(i, ti, ci);
  var operand = whenOperandOf(c);
  WHEN_SOURCES.forEach(function(k) { delete c[k]; });
  c[source] = operand;
  renderActions();
}

function setTargetWhenOperand(i, ti, ci, val) {
  var c = targetWhenAt(i, ti, ci);
  c[whenSourceOf(c)] = val;
}

function onTargetWhenOpChange(i, ti, ci, op) {
  var c = targetWhenAt(i, ti, ci);
  c.op = op;
  if (op === 'empty' || op === 'notEmpty') c.value = '';
  renderActions();
}

function onKindChange(i, val) {
  currentActions[i].kind = val;
  if (val === 'navigate' && !currentActions[i].navigate) {
    currentActions[i].navigate = { target: 'record-page', pageSlug: '', resourceSlug: '', scope: '' };
  }
  renderActions();
}

function onOpChange(i, ci, op) {
  var c = currentActions[i].visibleWhen[ci];
  var wasList = isListOp(c.op);
  c.op = op;
  // Switch value shape for in/not_in vs empty/notEmpty vs the scalar operators.
  if (isEmptyOp(op)) {
    c.value = '';
  } else if (isListOp(op) && !wasList) {
    c.value = (c.value == null || c.value === '') ? [] : [String(c.value)];
  } else if (!isListOp(op) && wasList) {
    c.value = Array.isArray(c.value) ? (c.value[0] || '') : (c.value || '');
  }
  renderActions();
}

/**
 * Writes the picked token into the condition's value input. Parameterised tokens
 * are written as "$daysIn:30" — the default is seeded so the admin only edits the
 * number. A list operator keeps its array shape so the saved JSON stays uniform.
 */
function onVisibleWhenTokenSelect(i, ci, code) {
  if (!code) return;
  var c = currentActions[i].visibleWhen[ci];
  var token = null;
  TOKENS.forEach(function(t) { if (t.code === code) token = t; });
  var val = (token && token.param) ? (code + ':' + token.param) : code;
  c.value = isListOp(c.op) ? [val] : val;
  renderActions();
}

function renderActions() {
  var container = document.getElementById('actionsList');
  if (!currentActions.length) {
    container.innerHTML = '<div class="no-actions">No actions configured. Click "+ Add Action" to begin.</div>';
    return;
  }

  var html = '';
  currentActions.forEach(function(action, i) {
    html += '<div class="action-card">';
    html += '<div class="action-header"><span class="action-title">' + esc(action.label || action.action || 'New Action');
    html += '<span class="kind-badge ' + action.kind + '">' + action.kind + '</span></span>';
    html += '<button class="btn-danger" onclick="removeAction(' + i + ')" style="padding:4px 8px;font-size:11px;">Remove</button></div>';

    // Common fields
    html += '<div class="row">';
    html += '<div><label>Action Key</label><input value="' + esc(action.action) + '" onchange="currentActions[' + i + '].action=this.value" placeholder="Approve"></div>';
    html += '<div><label>Label</label><input value="' + esc(action.label) + '" onchange="currentActions[' + i + '].label=this.value" placeholder="Approve"></div>';
    html += '<div><label>Icon</label><input value="' + esc(action.icon || '') + '" onchange="currentActions[' + i + '].icon=this.value" placeholder="check_circle"></div>';
    html += '<div><label>Color</label><input value="' + esc(action.color || 'primary') + '" onchange="currentActions[' + i + '].color=this.value" placeholder="primary"></div>';
    html += '</div>';

    html += '<div class="row">';
    html += '<div><label>Dialog Title (optional)</label><input value="' + esc(action.title || '') + '" onchange="currentActions[' + i + '].title=this.value" placeholder="Postpone {$outlet.Name}"></div>';
    html += '<div><label>Dialog Subtitle (optional)</label><input value="' + esc(action.subtitle == null ? '' : action.subtitle) + '" onchange="currentActions[' + i + '].subtitle=this.value" placeholder="{Code} &bull; {Date}"></div>';
    html += '</div>';
    html += '<div class="hint">Headings accept <code>{Column}</code> placeholders resolved against the record — <code>{Code}</code>, <code>{Progress}</code>, <code>{$outlet.Name}</code> for a related record. Blank Title falls back to the action Label; blank Subtitle falls back to the record Code.</div>';

    html += '<div class="row" style="margin-top:12px;">';
    html += '<div><label>Kind</label><select onchange="onKindChange(' + i + ', this.value)">';
    ['mutate','navigate'].forEach(function(k) {
      html += '<option value="' + k + '"' + (action.kind === k ? ' selected' : '') + '>' + k + '</option>';
    });
    html += '</select></div>';
    html += '<div class="checkbox-row" style="align-self:end;margin-bottom:4px;"><input type="checkbox" ' + (action.confirm ? 'checked' : '') + ' onchange="currentActions[' + i + '].confirm=this.checked"> <label style="margin:0">Require confirmation</label></div>';
    html += '<div></div><div></div>';
    html += '</div>';

    if (action.kind === 'mutate') {
      html += renderMutateBlock(action, i);
    } else {
      html += renderNavigateBlock(action, i);
    }

    html += renderVisibleWhenBlock(action, i);

    html += '</div>';
  });

  container.innerHTML = html;
}

function renderMutateBlock(action, i) {
  var html = '<div class="sub-section"><h3>Mutate</h3>';
  html += '<div class="row">';
  html += '<div><label>Column</label><input value="' + esc(action.column || 'Progress') + '" onchange="currentActions[' + i + '].column=this.value" placeholder="Progress"></div>';
  html += '<div><label>Column Value (fixed outcome)</label><input value="' + esc(action.columnValue || '') + '" onchange="currentActions[' + i + '].columnValue=this.value" placeholder="Approved"></div>';
  html += '<div><label>Column Value Options (CSV, multi-outcome)</label><input value="' + esc((action.columnValueOptions || []).join(',')) + '" onchange="currentActions[' + i + '].columnValueOptions=this.value?this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean):[]"></div>';
  html += '</div>';

  html += '<div style="margin-top:8px;"><label>Fields — written to THIS record</label>';
  html += '<div class="hint">Use the SHORT name (<code>Comment</code>). The column is derived as <code>{Column}{ColumnValue}{Name}</code> — e.g. <code>ProgressPostponedComment</code>. A field whose derived column does not exist on the sheet is hidden.</div>';
  (action.fields || []).forEach(function(field, fi) {
    html += '<div class="field-row">';
    html += '<input value="' + esc(field.name) + '" onchange="currentActions[' + i + '].fields[' + fi + '].name=this.value" placeholder="Name (e.g. Comment)">';
    html += '<input value="' + esc(field.label || '') + '" onchange="currentActions[' + i + '].fields[' + fi + '].label=this.value" placeholder="Label (optional)">';
    html += '<select onchange="onFieldTypeChange(' + i + ',' + fi + ',this.value)">';
    FIELD_TYPES.forEach(function(t) {
      html += '<option value="' + t + '"' + (field.type === t ? ' selected' : '') + '>' + t + '</option>';
    });
    html += '</select>';
    html += '<input type="checkbox" ' + (field.required ? 'checked' : '') + ' onchange="currentActions[' + i + '].fields[' + fi + '].required=this.checked" title="Required"> <span style="font-size:11px">Req</span>';
    html += '<span class="remove-field" onclick="removeField(' + i + ',' + fi + ')" title="Remove field">&times;</span>';
    html += '</div>';
    html += renderOptionSourcing(i, null, fi, field);
  });
  html += '<button class="btn-secondary" onclick="addField(' + i + ')" style="margin-top:4px;padding:3px 10px;font-size:11px;">+ Add Field</button>';
  html += '</div>';

  html += renderTargetsBlock(action, i);
  html += '</div>';
  return html;
}

// ── Select option sourcing ────────────────────────────────────────────────────
// `ti === null` addresses a field on the action itself; a number addresses a
// field on that target. Both families share this editor.
function fieldAt(i, ti, fi) {
  return ti === null ? currentActions[i].fields[fi] : currentActions[i].targets[ti].fields[fi];
}

function setFieldOptions(i, ti, fi, csv) {
  var f = fieldAt(i, ti, fi);
  var list = (csv || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  if (list.length) f.options = list; else delete f.options;
}

// Authored as `Resource.Field` or `Resource.Field.LabelColumn`. Fewer than two
// parts clears the source rather than saving a half-built one.
function setFieldSource(i, ti, fi, str) {
  var f = fieldAt(i, ti, fi);
  var parts = (str || '').split('.').map(function(s) { return s.trim(); }).filter(Boolean);
  if (parts.length < 2) { delete f.source; return; }
  f.source = { resource: parts[0], field: parts[1] };
  if (parts[2]) f.source.label = parts[2];
}

function renderOptionSourcing(i, ti, fi, field) {
  if (field.type !== 'select') return '';
  var src = field.source || {};
  var srcStr = src.resource ? [src.resource, src.field, src.label].filter(Boolean).join('.') : '';
  var args = i + ',' + (ti === null ? 'null' : ti) + ',' + fi;
  var html = '<div class="opt-row">';
  html += '<input value="' + esc((field.options || []).join(',')) + '" onchange="setFieldOptions(' + args + ',this.value)" placeholder="Options (CSV) — Low,Medium,High">';
  html += '<input value="' + esc(srcStr) + '" onchange="setFieldSource(' + args + ',this.value)" placeholder="Source — Resource.Field[.LabelColumn]">';
  html += '</div>';
  return html;
}

// ── Targets ───────────────────────────────────────────────────────────────────
function renderTargetsBlock(action, i) {
  var html = '<div class="sub-section" style="background:#fff;"><h3>Targets — extra records this action writes</h3>';
  html += '<div class="hint">Each target is ONE extra create/update performed in the same request. Field rule: <code>Type</code> makes it visible to the user; <code>From</code>/<code>Value</code> seed it server-side. Both together = an editable pre-fill. Leave <code>Type</code> empty for a silent copied field.</div>';
  html += '<div class="hint">Expressions: <code>$record.Column</code>, <code>$field.Name</code>, <code>$target.key.Column</code>, <code>$userName</code>, <code>$userCode</code>, <code>$today</code>, <code>$date:7</code>. Anything else is a literal.</div>';

  (action.targets || []).forEach(function(target, ti) {
    html += '<div class="target-card">';
    html += '<div class="target-head"><span class="target-title">' + esc(target.label || target.resource || 'New Target');
    html += '<span class="mode-badge">' + esc(target.mode || 'create') + '</span></span>';
    html += '<button class="btn-danger" onclick="removeTarget(' + i + ',' + ti + ')" style="padding:3px 8px;font-size:10px;">Remove Target</button></div>';

    html += '<div class="row">';
    html += '<div><label>Resource</label><select onchange="currentActions[' + i + '].targets[' + ti + '].resource=this.value"><option value="">-- Select --</option>';
    resourceData.forEach(function(r) {
      html += '<option value="' + esc(r.name) + '"' + (target.resource === r.name ? ' selected' : '') + '>' + esc(r.label + ' (' + r.name + ')') + '</option>';
    });
    html += '</select></div>';
    html += '<div><label>Mode</label><select onchange="onTargetModeChange(' + i + ',' + ti + ',this.value)">';
    TARGET_MODES.forEach(function(m) {
      html += '<option value="' + m + '"' + (target.mode === m ? ' selected' : '') + '>' + m + '</option>';
    });
    html += '</select></div>';
    html += '<div><label>Key</label><input value="' + esc(target.key || '') + '" onchange="currentActions[' + i + '].targets[' + ti + '].key=this.value" placeholder="newVisit"></div>';
    html += '<div><label>Label</label><input value="' + esc(target.label || '') + '" onchange="currentActions[' + i + '].targets[' + ti + '].label=this.value" placeholder="New Visit"></div>';
    html += '</div>';

    if (target.mode === 'update') {
      html += '<div><label>Code Expression (which record to update)</label>';
      html += '<input value="' + esc(target.code || '') + '" onchange="currentActions[' + i + '].targets[' + ti + '].code=this.value" placeholder="$record.ParentCode">';
      html += '<div class="hint">Required for update. An expression resolving to empty fails the action rather than creating a stray record.</div></div>';
    }

    html += renderTargetWhenBlock(target, i, ti);

    html += '<div class="tf-head"><span>Name (column)</span><span>Label</span><span>Type</span><span>Req</span><span>From</span><span>Value</span><span></span></div>';
    (target.fields || []).forEach(function(field, fi) {
      html += '<div class="tf-row">';
      html += '<input value="' + esc(field.name || '') + '" onchange="currentActions[' + i + '].targets[' + ti + '].fields[' + fi + '].name=this.value" placeholder="OutletCode">';
      html += '<input value="' + esc(field.label || '') + '" onchange="currentActions[' + i + '].targets[' + ti + '].fields[' + fi + '].label=this.value" placeholder="optional">';
      // An EMPTY type is meaningful here — it marks the field silent/non-editable.
      html += '<select onchange="onTargetFieldTypeChange(' + i + ',' + ti + ',' + fi + ',this.value)">';
      html += '<option value=""' + (!field.type ? ' selected' : '') + '>— hidden —</option>';
      FIELD_TYPES.forEach(function(t) {
        html += '<option value="' + t + '"' + (field.type === t ? ' selected' : '') + '>' + t + '</option>';
      });
      html += '</select>';
      html += '<input type="checkbox" ' + (field.required ? 'checked' : '') + ' onchange="currentActions[' + i + '].targets[' + ti + '].fields[' + fi + '].required=this.checked" title="Required (only applies to visible fields)">';
      // No `|| ''` fallback: `esc` already maps null/undefined to '', and a
      // literal 0 or false must render as itself rather than as an empty box.
      html += '<input value="' + esc(field.from) + '" onchange="currentActions[' + i + '].targets[' + ti + '].fields[' + fi + '].from=this.value" placeholder="$record.OutletCode">';
      html += '<input value="' + esc(field.value) + '" onchange="currentActions[' + i + '].targets[' + ti + '].fields[' + fi + '].value=this.value" placeholder="PLANNED">';
      html += '<span class="remove-field" onclick="removeTargetField(' + i + ',' + ti + ',' + fi + ')" title="Remove field">&times;</span>';
      html += '</div>';
      html += renderOptionSourcing(i, ti, fi, field);
    });
    html += '<button class="btn-secondary" onclick="addTargetField(' + i + ',' + ti + ')" style="margin-top:6px;padding:3px 10px;font-size:11px;">+ Add Target Field</button>';
    html += '</div>';
  });

  html += '<button class="btn-secondary" onclick="addTarget(' + i + ')" style="margin-top:8px;padding:4px 12px;font-size:11px;">+ Add Target</button>';
  html += '</div>';
  return html;
}

/**
 * The optional `when` gate on ONE target. Reuses the visibleWhen condition-row
 * markup and its op list, with one extra select for the left-operand source.
 */
function renderTargetWhenBlock(target, i, ti) {
  var html = '<div style="margin-top:10px;"><label>Run When (AND) — leave empty to always run</label>';
  html += '<div class="hint">Skips this target ENTIRELY when false: nothing is resolved, validated or written, and its <code>Required</code> fields are not enforced. Use it for an OPTIONAL follow-up record — e.g. <code>field</code> / <code>Date</code> / <code>notEmpty</code> creates a replacement only when the user supplies a date.</div>';
  html += '<div class="hint"><code>field</code> = an input on THIS target (literal column name). <code>column</code> = a column on the source record, before the action ran. <code>expression</code> = any From/Value expression (<code>$record.X</code>, <code>$field.X</code>, <code>$today</code>). Note a target another target reads via <code>$target.key.Column</code> must NOT be conditional.</div>';

  (target.when || []).forEach(function(c, ci) {
    var isList = (c.op === 'in' || c.op === 'nin');
    var isEmptyOp = (c.op === 'empty' || c.op === 'notEmpty');
    var source = whenSourceOf(c);
    var valDisplay = isList
      ? (Array.isArray(c.value) ? c.value.join(',') : (c.value || ''))
      : (c.value == null ? '' : String(c.value));
    var args = i + ',' + ti + ',' + ci;

    html += '<div class="cond-row">';
    html += '<select onchange="onTargetWhenSourceChange(' + args + ', this.value)">';
    WHEN_SOURCES.forEach(function(s) {
      html += '<option value="' + s + '"' + (source === s ? ' selected' : '') + '>' + s + '</option>';
    });
    html += '</select>';
    html += '<input value="' + esc(whenOperandOf(c)) + '" onchange="setTargetWhenOperand(' + args + ', this.value)" placeholder="Date">';
    html += '<select onchange="onTargetWhenOpChange(' + args + ', this.value)">';
    VALID_OPS.forEach(function(op) {
      html += '<option value="' + op + '"' + (c.op === op ? ' selected' : '') + '>' + op + '</option>';
    });
    html += '</select>';
    if (isEmptyOp) {
      html += '<input disabled placeholder="(no value)">';
    } else if (isList) {
      html += '<input value="' + esc(valDisplay) + '" onchange="currentActions[' + i + '].targets[' + ti + '].when[' + ci + '].value=this.value?this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean):[]" placeholder="Review,Pending">';
    } else {
      html += '<input value="' + esc(valDisplay) + '" onchange="currentActions[' + i + '].targets[' + ti + '].when[' + ci + '].value=this.value" placeholder="Value">';
    }
    html += '<span class="remove-cond" onclick="removeTargetCondition(' + args + ')" title="Remove condition">&times;</span>';
    html += '</div>';
  });

  html += '<button class="btn-secondary" onclick="addTargetCondition(' + i + ',' + ti + ')" style="margin-top:4px;padding:3px 10px;font-size:11px;">+ Add Condition</button>';
  html += '</div>';
  return html;
}

function renderNavigateBlock(action, i) {
  var nav = action.navigate || {};
  var html = '<div class="sub-section"><h3>Navigate</h3>';
  html += '<div class="row">';
  html += '<div><label>Target</label><select onchange="currentActions[' + i + '].navigate.target=this.value">';
  NAV_TARGETS.forEach(function(t) {
    html += '<option value="' + t + '"' + (nav.target === t ? ' selected' : '') + '>' + t + '</option>';
  });
  html += '</select></div>';
  html += '<div><label>Page Slug</label><input value="' + esc(nav.pageSlug || '') + '" onchange="currentActions[' + i + '].navigate.pageSlug=this.value" placeholder="record-review"></div>';
  html += '</div>';
  html += '<div class="row">';
  html += '<div><label>Resource Slug (optional)</label><input value="' + esc(nav.resourceSlug || '') + '" onchange="currentActions[' + i + '].navigate.resourceSlug=this.value" placeholder="purchase-requisitions"></div>';
  html += '<div><label>Scope (optional)</label><input value="' + esc(nav.scope || '') + '" onchange="currentActions[' + i + '].navigate.scope=this.value" placeholder="operations"></div>';
  html += '</div>';
  html += '<div class="hint">Leave resourceSlug / scope empty to stay on the current resource.</div>';
  html += '</div>';
  return html;
}

function renderVisibleWhenBlock(action, i) {
  var html = '<div class="sub-section"><h3>Visible When (AND)</h3>';
  html += '<div class="hint">Absent / empty = always visible. Multiple conditions are ANDed. Use comma-separated values for <code>in</code>/<code>not_in</code>.</div>';
  html += '<div class="hint">The value may be a literal or a <b>dynamic token</b> picked from the dropdown — resolved against the clock and the signed-in user when the action list is built. E.g. <code>Date</code> / <code>lte</code> / <code>$startOfDay:0</code> hides an action on future-dated records; <code>OwnerCode</code> / <code>eq</code> / <code>$userCode</code> shows it only to the owner. Parameterised tokens are written <code>$daysIn:30</code> — edit the number after the colon. Literal comparison is case-insensitive.</div>';
  (action.visibleWhen || []).forEach(function(c, ci) {
    var op = normalizeOp(c.op);
    var isList = isListOp(op);
    var noValue = isEmptyOp(op);
    var valDisplay = isList
      ? (Array.isArray(c.value) ? c.value.join(',') : (c.value || ''))
      : (c.value == null ? '' : String(c.value));
    html += '<div class="cond-row">';
    html += '<input value="' + esc(c.column || '') + '" onchange="currentActions[' + i + '].visibleWhen[' + ci + '].column=this.value" placeholder="Column (e.g. Progress)">';
    html += '<select onchange="onOpChange(' + i + ',' + ci + ', this.value)">';
    VISIBLE_WHEN_OPS.forEach(function(o) {
      html += '<option value="' + o + '"' + (op === o ? ' selected' : '') + '>' + o + '</option>';
    });
    html += '</select>';
    if (noValue) {
      html += '<input disabled placeholder="(no value)">';
    } else if (isList) {
      html += '<input value="' + esc(valDisplay) + '" onchange="currentActions[' + i + '].visibleWhen[' + ci + '].value=this.value?this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean):[]" placeholder="Review,Pending">';
    } else {
      html += '<input value="' + esc(valDisplay) + '" onchange="currentActions[' + i + '].visibleWhen[' + ci + '].value=this.value" placeholder="Value or $token">';
    }
    // The token picker only WRITES into the value input — free text stays fully
    // editable, so a literal and a token are authored the same way.
    html += '<select style="width:150px" ' + (noValue ? 'disabled' : '') + ' onchange="onVisibleWhenTokenSelect(' + i + ',' + ci + ', this.value)">';
    html += buildTokenOptions(valDisplay);
    html += '</select>';
    html += '<span class="remove-cond" onclick="removeCondition(' + i + ',' + ci + ')" title="Remove condition">&times;</span>';
    html += '</div>';
  });
  html += '<button class="btn-secondary" onclick="addCondition(' + i + ')" style="margin-top:4px;padding:3px 10px;font-size:11px;">+ Add Condition</button>';
  html += '</div>';
  return html;
}

function serializeForSave(a) {
  var out = {
    action: a.action,
    label: a.label || a.action,
    icon: a.icon || '',
    color: a.color || 'primary',
    kind: a.kind === 'navigate' ? 'navigate' : 'mutate',
    confirm: !!a.confirm
  };
  // Omitted entirely when blank so the dialog keeps its defaults (Label / Code)
  // rather than being handed an empty string it would render as a blank heading.
  if (notEmpty(a.title)) out.title = a.title;
  if (notEmpty(a.subtitle)) out.subtitle = a.subtitle;
  if (out.kind === 'mutate') {
    out.column = a.column || 'Progress';
    out.columnValue = a.columnValue || '';
    out.columnValueOptions = Array.isArray(a.columnValueOptions) ? a.columnValueOptions : [];
    out.fields = (Array.isArray(a.fields) ? a.fields : []).map(cleanField).filter(Boolean);

    // Targets are omitted entirely when none are configured, so an action that
    // does not use them serializes exactly as it did before this feature.
    var targets = (Array.isArray(a.targets) ? a.targets : [])
      .filter(function(t) { return t && t.resource; })
      .map(cleanTarget);
    if (targets.length) out.targets = targets;
  } else {
    var n = a.navigate || {};
    out.navigate = {
      target: n.target || 'record-page',
      pageSlug: n.pageSlug || ''
    };
    if (n.resourceSlug) out.navigate.resourceSlug = n.resourceSlug;
    if (n.scope) out.navigate.scope = n.scope;
  }
  // visibleWhen: drop invalid rows; collapse single-element array to object
  var conds = cleanConditions(a.visibleWhen, ['column'], VISIBLE_WHEN_OPS);
  if (conds.length === 1) out.visibleWhen = conds[0];
  else if (conds.length > 1) out.visibleWhen = conds;
  return out;
}

/**
 * Serializes one condition of the shared condition grammar.
 *
 * `operandKeys` is the accepted left-operand set in PRECEDENCE order — just
 * `column` for `visibleWhen`, `field` → `column` → `expression` for a target's
 * `when`. A row naming none of them, or carrying no value where the op needs
 * one, is dropped rather than saved half-built — the runtime evaluators on both
 * sides drop the same shapes, so an unfinished row simply does not constrain.
 *
 * `allowedOps` differs per grammar: a target's `when` is validated SERVER-side
 * against the six-op set, `visibleWhen` client-side against the wider one. It
 * defaults to the narrow set so an unqualified call cannot widen a target.
 */
function cleanCondition(c, operandKeys, allowedOps) {
  var ops = allowedOps || VALID_OPS;
  if (!c) return null;
  // Canonicalise before validating, so a legacy `ne`/`nin` row round-trips
  // through the editor as `neq`/`not_in` rather than being dropped.
  var op = (ops === VISIBLE_WHEN_OPS) ? normalizeOp(c.op) : c.op;
  if (ops.indexOf(op) === -1) return null;

  var key = null;
  for (var k = 0; k < operandKeys.length; k++) {
    if (notEmpty(c[operandKeys[k]])) { key = operandKeys[k]; break; }
  }
  if (!key) return null;

  var noValue = isEmptyOp(op);
  var isList = isListOp(op);
  if (!noValue) {
    if (isList && !(Array.isArray(c.value) && c.value.length > 0)) return null;
    if (!isList && (c.value == null || String(c.value) === '')) return null;
  }

  var out = {};
  out[key] = c[key];
  out.op = op;
  if (!noValue) out.value = c.value;
  return out;
}

function cleanConditions(list, operandKeys, allowedOps) {
  return (Array.isArray(list) ? list : (list ? [list] : []))
    .map(function(c) { return cleanCondition(c, operandKeys, allowedOps); })
    .filter(Boolean);
}

/**
 * Drops empty keys so the saved JSON carries only what was actually authored.
 * A cell full of `"from":"","value":"","label":""` is noise that makes the
 * config hard to read back and hard to diff.
 */
function cleanField(f) {
  if (!f || !f.name) return null;
  var out = { name: f.name };
  if (f.label) out.label = f.label;
  if (f.type) out.type = f.type;
  if (f.required) out.required = true;
  // `from` / `value` are tested for emptiness, NOT truthiness: a literal `0` or
  // `false` is a perfectly good constant to write into a column, and truthiness
  // would silently discard it.
  if (notEmpty(f.from)) out.from = f.from;
  if (notEmpty(f.value)) out.value = f.value;
  if (Array.isArray(f.options) && f.options.length) out.options = f.options;
  if (f.source && f.source.resource && f.source.field) out.source = f.source;
  return out;
}

function notEmpty(v) {
  return v !== undefined && v !== null && String(v).trim() !== '';
}

function cleanTarget(t) {
  var out = { resource: t.resource, mode: t.mode === 'update' ? 'update' : 'create' };
  if (t.key) out.key = t.key;
  if (t.label) out.label = t.label;
  // `code` only means anything for an update — carrying it on a create would
  // imply the record is addressable before it exists.
  if (out.mode === 'update' && t.code) out.code = t.code;
  // `when` is omitted ENTIRELY when nothing valid was authored, so a target that
  // does not use the gate serializes byte-identically to before this feature —
  // an empty array would read as "conditional" to a human diffing the config.
  var when = cleanConditions(t.when, ['field', 'column', 'expression']);
  if (when.length === 1) out.when = when[0];
  else if (when.length > 1) out.when = when;
  out.fields = (Array.isArray(t.fields) ? t.fields : []).map(cleanField).filter(Boolean);
  return out;
}

/**
 * Blocking config errors. These are mistakes the runtime can only report as a
 * failed action at click time, which is far too late to be useful — an update
 * without a code, or a target field that neither renders nor carries a value,
 * is always an authoring slip.
 */
function validateActions(actions) {
  var errors = [];
  actions.forEach(function(a) {
    (a.targets || []).forEach(function(t, ti) {
      var where = '"' + a.action + '" target ' + (t.key || '#' + (ti + 1));
      if (t.mode === 'update' && !t.code) {
        errors.push(where + ': update mode needs a Code expression.');
      }
      if (!t.fields.length) {
        errors.push(where + ': has no fields.');
      }
      t.fields.forEach(function(f) {
        if (!f.type && !f.from && f.value === undefined) {
          errors.push(where + ', field "' + f.name + '": needs a Type, a From, or a Value.');
        }
      });
    });
  });
  return errors;
}

function saveActions() {
  var resourceName = document.getElementById('resourceSelect').value;
  if (!resourceName) return;

  var clean = currentActions
    .filter(function(a) { return a.action; })
    .map(serializeForSave);

  var errors = validateActions(clean);
  if (errors.length) {
    showStatus('Cannot save — ' + errors.join('  •  '), 'error');
    return;
  }

  var json = JSON.stringify(clean);

  document.getElementById('saveBtn').disabled = true;
  document.getElementById('saveBtn').textContent = 'Saving...';

  google.script.run.withSuccessHandler(function() {
    showStatus('Actions saved successfully!', 'success');
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('saveBtn').textContent = 'Save Actions';
    var res = resourceData.find(function(r) { return r.name === resourceName; });
    if (res) res.additionalActions = clean;
  }).withFailureHandler(function(err) {
    showStatus('Failed to save: ' + err.message, 'error');
    document.getElementById('saveBtn').disabled = false;
    document.getElementById('saveBtn').textContent = 'Save Actions';
  }).app_saveResourceActions(resourceName, json);
}

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status-bar ' + type;
  if (type === 'success') setTimeout(function() { el.style.display = 'none'; }, 3000);
}

function esc(v) { return (v == null ? '' : String(v)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
