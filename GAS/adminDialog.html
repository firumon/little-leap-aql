<!doctype html>
<html>
<head>
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
  padding: 20px; 
  background-color: #F1F1F3; 
  color: #1e293b;
  font-size: 13px;
  line-height: 1.5;
}

h2 {
  font-size: 18px;
  font-weight: 700;
  color: #000077;
  margin-bottom: 16px;
  border-bottom: 2px solid #e2e8f0;
  padding-bottom: 8px;
}

.row { 
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  gap: 12px; 
  margin-bottom: 12px;
}

.g { 
  margin-bottom: 12px; 
}

label { 
  display: block; 
  font-size: 11px; 
  font-weight: 600; 
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #475569; 
  margin-bottom: 6px;
}

input, select, textarea { 
  width: 100%; 
  padding: 9px 12px; 
  border: 1px solid #cbd5e1; 
  border-radius: 8px; 
  font-family: inherit;
  font-size: 13px; 
  color: #0f172a;
  background-color: #fff;
  transition: all 0.2s ease;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: #000077;
  box-shadow: 0 0 0 3px rgba(0, 0, 119, 0.15);
}

textarea { 
  min-height: 70px; 
  resize: vertical;
}

.note { 
  font-size: 12px; 
  color: #64748b; 
  background-color: #e2e8f0;
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 16px;
  border-left: 4px solid #F58841;
}

.btn-invert {
  width: auto !important;
  padding: 2px 8px !important;
  background: #f1f5f9 !important;
  border: 1px solid #cbd5e1 !important;
  border-radius: 4px !important;
  color: #334155 !important;
  font-weight: 500 !important;
  font-size: 11px !important;
  margin-top: 0 !important;
  box-shadow: none !important;
  display: inline-block !important;
  height: auto !important;
  cursor: pointer;
}
.btn-invert:hover {
  background: #e2e8f0 !important;
  transform: none !important;
}

button { 
  width: 100%; 
  padding: 11px; 
  background: #000077; 
  border: 0; 
  border-radius: 8px; 
  color: #fff; 
  font-weight: 600; 
  font-size: 14px;
  margin-top: 16px; 
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 119, 0.2);
}

button:hover {
  background: #000055;
  transform: translateY(-1px);
}

button:active {
  transform: translateY(0);
}

button:disabled {
  background: #94a3b8;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.msg { 
  display: none; 
  margin-top: 12px; 
  padding: 10px 14px; 
  border-radius: 8px; 
  font-size: 12px; 
  font-weight: 500;
  border: 1px solid transparent;
}

.ok { 
  background: #ecfdf5; 
  color: #065f46; 
  border-color: #a7f3d0;
}

.er { 
  background: #fef2f2; 
  color: #991b1b; 
  border-color: #fca5a5;
}

.box { 
  border: 1px solid #cbd5e1; 
  border-radius: 8px; 
  padding: 12px; 
  margin-top: 12px; 
  background: #fff;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

.box .small { 
  font-size: 11px; 
  font-weight: 600; 
  color: #475569;
  text-transform: uppercase;
  margin-bottom: 8px;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: 4px;
}

.small {
  font-size: 11px;
  color: #64748b;
  margin-top: 4px;
}

.checks { 
  display: flex; 
  flex-wrap: wrap;
  gap: 12px; 
}

.checks label { 
  font-weight: 500; 
  font-size: 12px; 
  text-transform: none;
  letter-spacing: normal;
  display: flex; 
  gap: 8px; 
  align-items: center; 
  cursor: pointer;
  color: #334155;
  margin-bottom: 0;
}

.checks input[type="checkbox"] {
  width: auto;
  margin: 0;
  cursor: pointer;
  box-shadow: none;
}

/* Custom Scrollbar for list selection */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: #f1f5f9;
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}
</style>
</head>
<body>

<?!= bodyHtml ?>

<div id="msg" class="msg"></div>

<script>
function submitForm(h) {
  var f = document.getElementById("mainForm");
  var b = document.getElementById("submitBtn");
  var m = document.getElementById("msg");
  var p = {};
  Array.from(f.elements).forEach(function(el) {
    if (!el.name) return;
    if (el.type === "checkbox") {
      if (el.name === "roles" || el.name === "additionalRoles") {
        var key = el.name;
        if (!p[key]) p[key] = [];
        if (el.checked) p[key].push(el.value);
      } else {
        p[el.name] = el.checked;
      }
    } else {
      p[el.name] = el.value;
    }
  });
  b.disabled = true;
  var t = b.innerText;
  b.innerText = "Processing...";
  m.style.display = "none";
  google.script.run
    .withSuccessHandler(function(r) {
      b.disabled = false;
      b.innerText = t;
      m.style.display = "block";
      m.className = "msg " + (r.success ? "ok" : "er");
      m.innerText = r.message || "Done";
      // Auto-close removed; users close manually when finished.
    })
    .withFailureHandler(function(e) {
      b.disabled = false;
      b.innerText = t;
      m.style.display = "block";
      m.className = "msg er";
      m.innerText = e.message || String(e);
    })[h](p);
}

function loadDetails(t, id) {
  if (!id) return;
  google.script.run
    .withSuccessHandler(function(d) { fillForm(d, t); })
    ["get" + t + "Details"](id);
}

function fillForm(d, t) {
  if (!d) return;
  Object.keys(d).forEach(function(k) {
    var el = document.querySelector("[name='" + k + "']");
    if (!el) return;
    if (el.type === "checkbox") {
      var v = d[k];
      el.checked = (v === true || String(v).toUpperCase() === "TRUE");
    } else {
      el.value = d[k] == null ? "" : d[k];
    }
  });
  if (t === "User") {
    var roles = (d.roles || "").toString().split(",").map(function(x) { return x.trim(); });
    var mainRole = roles.length > 0 ? roles[0] : "";
    var additionalRoles = roles.slice(1);
    var mainRoleEl = document.querySelector("[name='mainRole']");
    if (mainRoleEl) {
      mainRoleEl.value = mainRole;
    }
    onMainRoleChange(mainRole);
    document.querySelectorAll("input[name=additionalRoles]").forEach(function(cb) {
      cb.checked = additionalRoles.indexOf(cb.value) !== -1;
    });
  }
  if (t === "Role") {
    document.querySelectorAll("input[data-perm='1']").forEach(function(cb) { cb.checked = false; });
    document.querySelectorAll(".resource-assigned").forEach(function(cb) { cb.checked = false; });
    var map = d.roleActions || {};
    
    var hasPermissions = false;
    Object.keys(map).forEach(function(res) {
      hasPermissions = true;
    });
    
    if (!hasPermissions) {
      initializeDefaultMasterAssignments();
    } else {
      Object.keys(map).forEach(function(res) {
        var resSafe = res.replace(/[^a-zA-Z0-9]/g, "_");
        var assignCb = document.querySelector("input[name='assign__" + resSafe + "']");
        if (assignCb) assignCb.checked = true;

        var actions = map[res] || [];
        if (actions.indexOf('*') !== -1) {
          var container = document.querySelector("[data-resource-group='" + resSafe + "']");
          if (container) {
            container.querySelectorAll("input[data-perm='1']").forEach(function(cb) { cb.checked = true; });
          }
        } else {
          actions.forEach(function(act) {
            var k = "perm__" + resSafe + "__" + act.replace(/[^a-zA-Z0-9]/g, "_");
            var cb = document.querySelector("input[name='" + k + "']");
            if (cb) cb.checked = true;
          });
        }
      });
    }
  }
}

function initializeDefaultMasterAssignments() {
  var groups = document.querySelectorAll(".checks[data-scope='master']");
  groups.forEach(function(group) {
    var resSafe = group.getAttribute("data-resource-group");
    var assignCb = document.querySelector("input[name='assign__" + resSafe + "']");
    if (assignCb) assignCb.checked = true;
  });
}

window.onload = function() {
  var form = document.getElementById("mainForm");
  if (form) {
    var isCreateRole = form.getAttribute("onsubmit") && form.getAttribute("onsubmit").indexOf("handleCreateRole") !== -1;
    if (isCreateRole) {
      initializeDefaultMasterAssignments();
    }
    var isManageRole = form.getAttribute("onsubmit") && form.getAttribute("onsubmit").indexOf("submitManageRoleForm") !== -1;
    if (isManageRole) {
      onManageRoleChange("");
    }
    var isManageUsers = form.getAttribute("onsubmit") && form.getAttribute("onsubmit").indexOf("submitManageUsersForm") !== -1;
    if (isManageUsers) {
      onManageUsersChange("");
    }
    var isManageDesignations = form.getAttribute("onsubmit") && form.getAttribute("onsubmit").indexOf("submitManageDesignationsForm") !== -1;
    if (isManageDesignations) {
      onManageDesignationsChange("");
    }
    var isManageAccessRegions = form.getAttribute("onsubmit") && form.getAttribute("onsubmit").indexOf("submitManageAccessRegionsForm") !== -1;
    if (isManageAccessRegions) {
      onManageAccessRegionsChange("");
    }
  }
};

function onMainRoleChange(val) {
  document.querySelectorAll("input[name=additionalRoles]").forEach(function(cb) {
    if (cb.value === val) {
      cb.checked = false;
      cb.disabled = true;
      cb.parentElement.style.opacity = "0.5";
    } else {
      cb.disabled = false;
      cb.parentElement.style.opacity = "1";
    }
  });
}

function onManageUsersChange(userId) {
  var btn = document.getElementById("submitBtn");
  if (!userId) {
    var nameInput = document.querySelector("[name='name']");
    if (nameInput) nameInput.value = "";
    var emailInput = document.querySelector("[name='email']");
    if (emailInput) emailInput.value = "";
    var pwdInput = document.getElementById("userPasswordInput");
    if (pwdInput) {
      pwdInput.value = "";
      pwdInput.required = true;
    }
    var desInput = document.querySelector("[name='designationId']");
    if (desInput) desInput.value = "";
    var regInput = document.querySelector("[name='accessRegion']");
    if (regInput) regInput.value = "";
    var statInput = document.querySelector("[name='status']");
    if (statInput) statInput.value = "Active";
    var mainRoleInput = document.querySelector("[name='mainRole']");
    if (mainRoleInput) mainRoleInput.value = "";
    onMainRoleChange("");
    document.querySelectorAll("input[name=additionalRoles]").forEach(function(cb) {
      cb.checked = false;
    });
    if (btn) btn.innerText = "Create User";
  } else {
    var pwdInput = document.getElementById("userPasswordInput");
    if (pwdInput) pwdInput.required = false;
    loadDetails('User', userId);
    if (btn) btn.innerText = "Update User";
  }
}

function submitManageUsersForm() {
  submitForm('handleManageUser');
}

function onManageDesignationsChange(designationId) {
  var btn = document.getElementById("submitBtn");
  if (!designationId) {
    var nameInput = document.querySelector("[name='name']");
    if (nameInput) nameInput.value = "";
    var hlInput = document.querySelector("[name='hierarchyLevel']");
    if (hlInput) hlInput.value = "";
    var statInput = document.querySelector("[name='status']");
    if (statInput) statInput.value = "Active";
    var descInput = document.querySelector("[name='description']");
    if (descInput) descInput.value = "";
    if (btn) btn.innerText = "Create Designation";
  } else {
    loadDetails('Designation', designationId);
    if (btn) btn.innerText = "Update Designation";
  }
}

function submitManageDesignationsForm() {
  submitForm('handleManageDesignation');
}

function onManageAccessRegionsChange(lookupCode) {
  var btn = document.getElementById("submitBtn");
  if (!lookupCode) {
    var origCodeInput = document.querySelector("[name='originalCode']");
    if (origCodeInput) origCodeInput.value = "";
    var codeInput = document.querySelector("[name='code']");
    if (codeInput) {
      codeInput.value = "";
      codeInput.disabled = false;
    }
    var nameInput = document.querySelector("[name='name']");
    if (nameInput) nameInput.value = "";
    var parentInput = document.querySelector("[name='parent']");
    if (parentInput) parentInput.value = "";
    var formatNote = document.getElementById("codeFormatNote");
    if (formatNote) formatNote.style.display = "block";
    if (btn) btn.innerText = "Create Access Region";
  } else {
    var codeInput = document.querySelector("[name='code']");
    if (codeInput) {
      codeInput.disabled = false;
    }
    var formatNote = document.getElementById("codeFormatNote");
    if (formatNote) formatNote.style.display = "none";
    loadDetails('AccessRegion', lookupCode);
    if (btn) btn.innerText = "Update Access Region";
  }
}

function submitManageAccessRegionsForm() {
  submitForm('handleManageAccessRegion');
}

function onManageRoleChange(roleId) {
  var btn = document.getElementById("submitBtn");
  if (!roleId) {
    document.getElementById("roleNameInput").value = "";
    document.getElementById("roleDescInput").value = "";
    document.querySelectorAll("input[data-perm='1']").forEach(function(cb) { cb.checked = false; });
    document.querySelectorAll(".resource-assigned").forEach(function(cb) { cb.checked = false; });
    initializeDefaultMasterAssignments();
    if (btn) btn.innerText = "Create Role";
  } else {
    loadDetails('Role', roleId);
    if (btn) btn.innerText = "Update Role";
  }
}

function submitManageRoleForm() {
  var roleIdSelect = document.querySelector("[name='roleId']");
  var handler = (roleIdSelect && roleIdSelect.value) ? 'handleUpdateRole' : 'handleCreateRole';
  submitForm(handler);
}

function onResourceAssignedChange(cb) {
  var res = cb.getAttribute("data-resource");
  var container = document.querySelector("[data-resource-group='" + res + "']");
  if (!container) return;
  if (!cb.checked) {
    container.querySelectorAll("input[type='checkbox']").forEach(function(acb) {
      acb.checked = false;
    });
  }
}

function invertResourceActions(res) {
  var container = document.querySelector("[data-resource-group='" + res + "']");
  if (!container) return;
  var checkboxes = container.querySelectorAll("input[type='checkbox']");
  var anyChecked = false;
  checkboxes.forEach(function(acb) {
    acb.checked = !acb.checked;
    if (acb.checked) anyChecked = true;
  });
  var assignCb = document.querySelector("input[name='assign__" + res + "']");
  if (assignCb && anyChecked) {
    assignCb.checked = true;
  }
}

function onPermissionChange(res) {
  var container = document.querySelector("[data-resource-group='" + res + "']");
  if (!container) return;
  var anyChecked = Array.from(container.querySelectorAll("input[type='checkbox']")).some(function(cb) { return cb.checked; });
  var assignCb = document.querySelector("input[name='assign__" + res + "']");
  if (assignCb && anyChecked) {
    assignCb.checked = true;
  }
}
</script>
</body>
</html>
