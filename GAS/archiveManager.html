<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background: #F1F1F3;
      color: #1e293b;
      font-size: 13px;
      line-height: 1.5;
    }
    h2, h3, h4 { margin: 0; color: #000077; font-weight: 700; }
    .g { margin: 12px 0; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: #0f172a;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #000077;
      box-shadow: 0 0 0 3px rgba(0, 0, 119, 0.15);
    }
    .btn {
      padding: 9px 16px;
      border: 0;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-primary { background: #000077; color: #fff; box-shadow: 0 4px 6px -1px rgba(0, 0, 119, 0.2); }
    .btn-primary:hover { background: #000055; }
    .btn-secondary { background: #fff; color: #475569; border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background: #f8fafc; }
    .btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 5px 10px; font-size: 11px; border-radius: 6px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05);
    }
    .flex { display: flex; gap: 10px; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
      font-weight: 500;
    }
    .ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .er { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-active { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge-disabled { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
    .nav-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 4px;
    }
    .tab-btn {
      padding: 6px 14px;
      border: none;
      background: none;
      font-weight: 600;
      font-size: 13px;
      color: #64748b;
      cursor: pointer;
      border-radius: 6px;
    }
    .tab-btn.active {
      background: #000077;
      color: #fff;
    }
    .token-chip {
      display: inline-block;
      padding: 2px 7px;
      background: #f1f5f9;
      color: #000077;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      cursor: pointer;
      margin-right: 4px;
      margin-top: 4px;
    }
    .token-chip:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }
    .condition-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #F58841;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .condition-row {
      display: grid;
      grid-template-columns: 140px 1fr 140px 1.5fr 36px;
      gap: 8px;
      align-items: end;
    }
    .relation-box {
      background: #fff;
      border: 1px dashed #94a3b8;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
    }
    .logic-toggle {
      padding: 4px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      color: #000077;
    }
    .hidden { display: none !important; }
    .loader {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div id="loader" class="loader">
    Loading resource archive policies...
  </div>

  <div id="app" class="hidden">
    <div id="msgBox" class="msg"></div>

    <div class="card flex-between" style="border-left: 4px solid #000077;">
      <div style="flex: 1; max-width: 420px;">
        <label for="resourceSelect">Select Resource</label>
        <select id="resourceSelect" onchange="onResourceChange()"></select>
      </div>
      <div>
        <label>Current Status</label>
        <span id="statusBadge" class="status-badge badge-disabled">Disabled</span>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tabVisual" onclick="switchTab('visual')">Visual Editor</button>
      <button class="tab-btn" id="tabRaw" onclick="switchTab('raw')">Raw JSON</button>
    </div>

    <div id="panelVisual">
      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 14px;">1. Archive Settings</h3>
        <div class="grid-3">
          <div>
            <label for="archiveFrequency">Frequency</label>
            <select id="archiveFrequency">
              <option value="MONTHLY">MONTHLY (Every Month)</option>
              <option value="BIMONTHLY">BIMONTHLY (Every 2 Months)</option>
              <option value="QUARTERLY">QUARTERLY (Every 3 Months)</option>
              <option value="SEMIANNUAL">SEMIANNUAL (Every 6 Months)</option>
              <option value="ANNUAL">ANNUAL (Every Year)</option>
            </select>
          </div>
          <div>
            <label for="archiveFilename">File Name Pattern</label>
            <input type="text" id="archiveFilename" placeholder="ARCHIVE_{{YEAR}}_{{FREQ}}" value="ARCHIVE_{{YEAR}}_{{FREQ}}">
          </div>
          <div>
            <label for="archiveLimit">Batch Limit</label>
            <input type="number" id="archiveLimit" placeholder="30" value="30" min="1" max="500">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="flex-between" style="margin-bottom: 12px;">
          <div>
            <h3 style="font-size: 14px;">2. Archive Rules & Conditions</h3>
            <span style="font-size: 11px; color: #64748b;">Records matching these rules will be moved to the archive spreadsheet.</span>
          </div>
          <div class="flex">
            <span style="font-size: 11px; font-weight: 600; color: #475569;">MATCH LOGIC:</span>
            <button type="button" class="logic-toggle" id="groupLogicBtn" onclick="toggleGroupLogic()">AND</button>
          </div>
        </div>

        <div id="conditionsList"></div>

        <div class="flex" style="margin-top: 12px;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="addConditionRow()">+ Add Column Rule</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="addRelationRow()">+ Add Relation Rule</button>
        </div>
      </div>
    </div>

    <div id="panelRaw" class="hidden">
      <div class="card">
        <label for="rawJsonText">Archive Policy JSON</label>
        <textarea id="rawJsonText" rows="18" style="font-family: monospace; font-size: 12px;"></textarea>
      </div>
    </div>

    <div class="flex-between" style="margin-top: 16px;">
      <div class="flex">
        <button type="button" class="btn btn-primary" onclick="savePolicy()">Save Archive Policy</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="clearPolicy()">Clear / Disable Policy</button>
      </div>
      <button type="button" class="btn btn-secondary" onclick="google.script.host.close()">Close</button>
    </div>
  </div>

  <script>
    let appData = { resources: [] };
    let currentResource = null;
    let currentLogic = 'AND';
    let conditionRows = [];

    window.onload = function() {
      google.script.run
        .withSuccessHandler(initData)
        .withFailureHandler(showError)
        .app_getArchiveManagerData();
    };

    function initData(data) {
      appData = data || { resources: [] };
      document.getElementById('loader').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');

      const select = document.getElementById('resourceSelect');
      select.innerHTML = '';
      appData.resources.forEach(res => {
        const opt = document.createElement('option');
        opt.value = res.name;
        opt.textContent = `${res.name} (${res.scope})`;
        select.appendChild(opt);
      });

      if (appData.resources.length > 0) {
        select.value = appData.resources[0].name;
        loadResource(appData.resources[0].name);
      }
    }

    function onResourceChange() {
      const select = document.getElementById('resourceSelect');
      loadResource(select.value);
    }

    function loadResource(name) {
      currentResource = appData.resources.find(r => r.name === name);
      if (!currentResource) return;

      const policy = currentResource.archive || {};
      const hasPolicy = policy && policy.condition && Object.keys(policy.condition).length > 0;

      const badge = document.getElementById('statusBadge');
      if (hasPolicy) {
        badge.textContent = 'Active';
        badge.className = 'status-badge badge-active';
      } else {
        badge.textContent = 'Disabled';
        badge.className = 'status-badge badge-disabled';
      }

      document.getElementById('archiveFrequency').value = policy.frequency || 'MONTHLY';
      document.getElementById('archiveFilename').value = policy.filename || 'ARCHIVE_{{YEAR}}_{{FREQ}}';
      document.getElementById('archiveLimit').value = policy.limit || 30;

      const cond = policy.condition || {};
      currentLogic = (cond.logic || 'AND').toUpperCase();
      document.getElementById('groupLogicBtn').textContent = currentLogic;

      conditionRows = [];
      if (Array.isArray(cond.items) && cond.items.length > 0) {
        cond.items.forEach(item => conditionRows.push(item));
      } else if (cond.column || cond.relation) {
        conditionRows.push(cond);
      }

      renderConditions();
      updateRawJson();
    }

    function toggleGroupLogic() {
      currentLogic = currentLogic === 'AND' ? 'OR' : 'AND';
      document.getElementById('groupLogicBtn').textContent = currentLogic;
      updateRawJson();
    }

    function renderConditions() {
      const list = document.getElementById('conditionsList');
      list.innerHTML = '';

      if (conditionRows.length === 0) {
        list.innerHTML = '<div style="color: #94a3b8; font-style: italic; padding: 12px 0;">No archive conditions set. Click "+ Add Column Rule" to create one.</div>';
        return;
      }

      const headers = currentResource.headers || [];
      const relations = currentResource.relations || [];

      conditionRows.forEach((row, idx) => {
        const box = document.createElement('div');
        box.className = 'condition-box';

        if (row.relation) {
          // Relation Rule
          const subCond = row.condition || {};
          box.innerHTML = `
            <div class="flex-between" style="margin-bottom: 8px;">
              <span style="font-weight: 700; color: #000077; font-size: 12px;">🔗 Relation Rule</span>
              <button type="button" class="btn btn-danger btn-sm" onclick="removeCondition(${idx})">✕</button>
            </div>
            <div class="grid-2" style="margin-bottom: 8px;">
              <div>
                <label>Related Resource</label>
                <select onchange="updateRelationName(${idx}, this.value)">
                  ${renderRelationOptions(row.relation, relations)}
                </select>
              </div>
            </div>
            <div class="relation-box">
              <label style="color: #000077;">Must Match Child / Parent Condition</label>
              <div style="display: grid; grid-template-columns: 1fr 140px 1.5fr; gap: 8px;">
                <div>
                  <input type="text" placeholder="Column Name (e.g. Status)" value="${escapeHtml(subCond.column || '')}" oninput="updateRelationSubCol(${idx}, this.value)">
                </div>
                <div>
                  <select onchange="updateRelationSubOp(${idx}, this.value)">
                    ${renderOperatorOptions(subCond.operator || 'eq')}
                  </select>
                </div>
                <div>
                  <input type="text" placeholder="Value or Token" value="${escapeHtml(subCond.value ?? '')}" oninput="updateRelationSubVal(${idx}, this.value)">
                  <div style="margin-top: 4px;">
                    <span class="token-chip" onclick="insertSubToken(${idx}, '$daysAgo:90')">$daysAgo:90</span>
                    <span class="token-chip" onclick="insertSubToken(${idx}, '$today')">$today</span>
                    <span class="token-chip" onclick="insertSubToken(${idx}, '$now')">$now</span>
                  </div>
                </div>
              </div>
            </div>
          `;
        } else {
          // Column Rule
          box.innerHTML = `
            <div class="condition-row">
              <div>
                <label>Target Column</label>
                <select onchange="updateConditionCol(${idx}, this.value)">
                  ${renderHeaderOptions(row.column, headers)}
                </select>
              </div>
              <div>
                <label>Operator</label>
                <select onchange="updateConditionOp(${idx}, this.value)">
                  ${renderOperatorOptions(row.operator || 'eq')}
                </select>
              </div>
              <div style="grid-column: span 2;">
                <label>Value / Token</label>
                <input type="text" placeholder="Value or Token (e.g. Completed, $daysAgo:90)" value="${escapeHtml(row.value ?? '')}" oninput="updateConditionVal(${idx}, this.value)">
                <div style="margin-top: 4px;">
                  <span class="token-chip" onclick="insertToken(${idx}, '$daysAgo:30')">$daysAgo:30</span>
                  <span class="token-chip" onclick="insertToken(${idx}, '$daysAgo:90')">$daysAgo:90</span>
                  <span class="token-chip" onclick="insertToken(${idx}, '$daysAgo:180')">$daysAgo:180</span>
                  <span class="token-chip" onclick="insertToken(${idx}, '$today')">$today</span>
                  <span class="token-chip" onclick="insertToken(${idx}, '$now')">$now</span>
                </div>
              </div>
              <div>
                <button type="button" class="btn btn-danger btn-sm" onclick="removeCondition(${idx})">✕</button>
              </div>
            </div>
          `;
        }

        list.appendChild(box);
      });
    }

    function renderHeaderOptions(selected, headers) {
      let html = '<option value="">-- Choose Column --</option>';
      headers.forEach(h => {
        html += `<option value="${h}" ${h === selected ? 'selected' : ''}>${h}</option>`;
      });
      if (selected && !headers.includes(selected)) {
        html += `<option value="${selected}" selected>${selected}</option>`;
      }
      return html;
    }

    function renderRelationOptions(selected, relations) {
      let html = '<option value="">-- Choose Relation --</option>';
      relations.forEach(r => {
        html += `<option value="${r}" ${r === selected ? 'selected' : ''}>${r}</option>`;
      });
      if (selected && !relations.includes(selected)) {
        html += `<option value="${selected}" selected>${selected}</option>`;
      }
      return html;
    }

    function renderOperatorOptions(selected) {
      const ops = [
        { v: 'eq', l: 'Equals (=)' },
        { v: 'neq', l: 'Not Equals (!=)' },
        { v: 'gt', l: 'Greater Than (>)' },
        { v: 'gte', l: 'Greater Or Equal (>=)' },
        { v: 'lt', l: 'Less Than (<)' },
        { v: 'lte', l: 'Less Or Equal (<=)' },
        { v: 'contains', l: 'Contains' },
        { v: 'empty', l: 'Is Empty' },
        { v: 'notEmpty', l: 'Is Not Empty' },
        { v: 'in', l: 'In (Comma list)' },
        { v: 'not_in', l: 'Not In (Comma list)' }
      ];
      return ops.map(o => `<option value="${o.v}" ${o.v === selected ? 'selected' : ''}>${o.l}</option>`).join('');
    }

    function addConditionRow() {
      const firstHeader = (currentResource.headers && currentResource.headers[0]) || 'Status';
      conditionRows.push({ column: firstHeader, operator: 'eq', value: '' });
      renderConditions();
      updateRawJson();
    }

    function addRelationRow() {
      const firstRel = (currentResource.relations && currentResource.relations[0]) || '';
      conditionRows.push({
        relation: firstRel,
        condition: { column: 'Status', operator: 'eq', value: '' }
      });
      renderConditions();
      updateRawJson();
    }

    function removeCondition(idx) {
      conditionRows.splice(idx, 1);
      renderConditions();
      updateRawJson();
    }

    function updateConditionCol(idx, val) {
      conditionRows[idx].column = val;
      updateRawJson();
    }

    function updateConditionOp(idx, val) {
      conditionRows[idx].operator = val;
      updateRawJson();
    }

    function updateConditionVal(idx, val) {
      conditionRows[idx].value = val;
      updateRawJson();
    }

    function insertToken(idx, token) {
      conditionRows[idx].value = token;
      renderConditions();
      updateRawJson();
    }

    function updateRelationName(idx, val) {
      conditionRows[idx].relation = val;
      updateRawJson();
    }

    function updateRelationSubCol(idx, val) {
      if (!conditionRows[idx].condition) conditionRows[idx].condition = {};
      conditionRows[idx].condition.column = val;
      updateRawJson();
    }

    function updateRelationSubOp(idx, val) {
      if (!conditionRows[idx].condition) conditionRows[idx].condition = {};
      conditionRows[idx].condition.operator = val;
      updateRawJson();
    }

    function updateRelationSubVal(idx, val) {
      if (!conditionRows[idx].condition) conditionRows[idx].condition = {};
      conditionRows[idx].condition.value = val;
      updateRawJson();
    }

    function insertSubToken(idx, token) {
      if (!conditionRows[idx].condition) conditionRows[idx].condition = {};
      conditionRows[idx].condition.value = token;
      renderConditions();
      updateRawJson();
    }

    function buildCurrentPolicyObject() {
      const freq = document.getElementById('archiveFrequency').value || 'MONTHLY';
      const filename = document.getElementById('archiveFilename').value || 'ARCHIVE_{{YEAR}}_{{FREQ}}';
      const limit = Number(document.getElementById('archiveLimit').value) || 30;

      if (conditionRows.length === 0) {
        return {};
      }

      return {
        frequency: freq,
        filename: filename,
        limit: limit,
        condition: {
          logic: currentLogic,
          items: conditionRows
        }
      };
    }

    function updateRawJson() {
      const obj = buildCurrentPolicyObject();
      document.getElementById('rawJsonText').value = Object.keys(obj).length > 0 ? JSON.stringify(obj, null, 2) : '';
    }

    function switchTab(tab) {
      document.getElementById('tabVisual').className = 'tab-btn' + (tab === 'visual' ? ' active' : '');
      document.getElementById('tabRaw').className = 'tab-btn' + (tab === 'raw' ? ' active' : '');

      if (tab === 'visual') {
        const rawText = document.getElementById('rawJsonText').value.trim();
        if (rawText) {
          try {
            const parsed = JSON.parse(rawText);
            document.getElementById('archiveFrequency').value = parsed.frequency || 'MONTHLY';
            document.getElementById('archiveFilename').value = parsed.filename || 'ARCHIVE_{{YEAR}}_{{FREQ}}';
            document.getElementById('archiveLimit').value = parsed.limit || 30;
            const cond = parsed.condition || {};
            currentLogic = (cond.logic || 'AND').toUpperCase();
            document.getElementById('groupLogicBtn').textContent = currentLogic;
            conditionRows = Array.isArray(cond.items) ? cond.items : (cond.column || cond.relation ? [cond] : []);
            renderConditions();
          } catch (e) {
            showError('Invalid JSON in editor: ' + e.message);
            return;
          }
        } else {
          conditionRows = [];
          renderConditions();
        }
        document.getElementById('panelVisual').classList.remove('hidden');
        document.getElementById('panelRaw').classList.add('hidden');
      } else {
        updateRawJson();
        document.getElementById('panelVisual').classList.add('hidden');
        document.getElementById('panelRaw').classList.remove('hidden');
      }
    }

    function savePolicy() {
      let policyObj;
      const isRawTab = document.getElementById('tabRaw').classList.contains('active');

      if (isRawTab) {
        const text = document.getElementById('rawJsonText').value.trim();
        if (!text) {
          policyObj = {};
        } else {
          try {
            policyObj = JSON.parse(text);
          } catch (e) {
            showError('Invalid JSON: ' + e.message);
            return;
          }
        }
      } else {
        policyObj = buildCurrentPolicyObject();
      }

      showMsg('Saving archive policy...', false);
      google.script.run
        .withSuccessHandler(function() {
          showMsg('Archive policy saved successfully!', true);
          currentResource.archive = policyObj;
          loadResource(currentResource.name);
        })
        .withFailureHandler(showError)
        .app_saveResourceArchivePolicy(currentResource.name, policyObj);
    }

    function clearPolicy() {
      if (!confirm(`Are you sure you want to disable and clear the archive policy for ${currentResource.name}?`)) return;

      showMsg('Clearing archive policy...', false);
      google.script.run
        .withSuccessHandler(function() {
          showMsg('Archive policy cleared and disabled!', true);
          currentResource.archive = {};
          loadResource(currentResource.name);
        })
        .withFailureHandler(showError)
        .app_saveResourceArchivePolicy(currentResource.name, {});
    }

    function showMsg(text, isOk) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = 'msg ' + (isOk ? 'ok' : 'er');
      box.style.display = 'block';
      if (isOk) {
        setTimeout(() => { box.style.display = 'none'; }, 4000);
      }
    }

    function showError(err) {
      showMsg(err?.message || String(err), false);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
