<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9fafb;
      color: #111827;
      font-size: 14px;
    }
    .container {
      max-width: 100%;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #374151;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }
    button {
      padding: 10px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-secondary {
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      color: #374151;
    }
    .btn-secondary:hover {
      background-color: #f3f4f6;
    }
    .btn-primary {
      background-color: #2563eb;
      border: 1px solid transparent;
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: #1d4ed8;
    }
    .btn-primary:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    
    /* Progress Section */
    .progress-container {
      display: none;
      margin-top: 20px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 16px;
    }
    .progress-step {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      color: #9ca3af;
      transition: color 0.2s;
    }
    .progress-step:last-child {
      margin-bottom: 0;
    }
    .step-icon {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      font-size: 10px;
      font-weight: bold;
    }
    .step-text {
      font-weight: 500;
    }
    
    /* Step States */
    .step-pending .step-icon {
      border-color: #d1d5db;
      background: transparent;
    }
    .step-active {
      color: #2563eb;
    }
    .step-active .step-icon {
      border-color: #2563eb;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    .step-success {
      color: #10b981;
    }
    .step-success .step-icon {
      border-color: #10b981;
      background-color: #10b981;
      color: white;
    }
    .step-success .step-icon::after {
      content: "✓";
    }
    .step-error {
      color: #ef4444;
    }
    .step-error .step-icon {
      border-color: #ef4444;
      background-color: #ef4444;
      color: white;
    }
    .step-error .step-icon::after {
      content: "✗";
    }
    
    /* Results Box */
    .results-box {
      display: none;
      margin-top: 16px;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      color: #065f46;
      max-height: 150px;
      overflow-y: auto;
    }
    .results-box h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
    }
    .results-list {
      margin: 0;
      padding-left: 16px;
    }
    .results-list li {
      margin-bottom: 4px;
      font-family: monospace;
    }

    .error-box {
      display: none;
      margin-top: 16px;
      background-color: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 12px;
      color: #991b1b;
      font-size: 13px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container" id="formContainer">
    <form id="tenantForm" onsubmit="event.preventDefault(); startOnboarding();">
      <div class="form-group">
        <label for="tenantName">Tenant Name</label>
        <input type="text" id="tenantName" required placeholder="e.g. Acme Corporation">
      </div>
      <div class="row">
        <div class="form-group">
          <label for="tenantCode">Tenant Code</label>
          <input type="text" id="tenantCode" required placeholder="e.g. ACM" maxlength="10">
        </div>
        <div class="form-group">
          <label for="dirName">Directory Name</label>
          <input type="text" id="dirName" required placeholder="e.g. Acme Corporation">
        </div>
      </div>
      <div class="buttons">
        <button type="button" class="btn-secondary" onclick="google.script.host.close();">Cancel</button>
        <button type="submit" class="btn-primary" id="submitBtn">Create Tenant</button>
      </div>
    </form>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-step step-pending" id="step1">
      <span class="step-icon"></span>
      <span class="step-text" id="step1Text">Step 1: Registering tenant & creating folder...</span>
    </div>
    <div class="progress-step step-pending" id="step2">
      <span class="step-icon"></span>
      <span class="step-text" id="step2Text">Step 2: Copying App template spreadsheet...</span>
    </div>
    <div class="progress-step step-pending" id="step3">
      <span class="step-icon"></span>
      <span class="step-text" id="step3Text">Step 3: Creating Master, Operations, Accounts, Views, and Reports...</span>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="results-box" id="resultsBox">
      <h4>🎉 Tenant Created Successfully!</h4>
      <ul class="results-list" id="resultsList"></ul>
      <div style="margin-top: 12px; text-align: right;">
        <button type="button" class="btn-primary" onclick="google.script.host.close();">Close</button>
      </div>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('tenantName');
    const codeInput = document.getElementById('tenantCode');
    const dirInput = document.getElementById('dirName');
    const submitBtn = document.getElementById('submitBtn');
    let userModifiedDir = false;

    // Auto-fill Directory Name from Tenant Name
    nameInput.addEventListener('input', () => {
      if (!userModifiedDir) {
        dirInput.value = nameInput.value;
      }
    });

    dirInput.addEventListener('input', () => {
      userModifiedDir = dirInput.value.length > 0;
    });

    // Make tenant code uppercase and strip space
    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.toUpperCase().replace(/\s+/g, '');
    });

    function setStepState(stepId, state) {
      const stepEl = document.getElementById(stepId);
      stepEl.className = 'progress-step ' + state;
    }

    function startOnboarding() {
      const name = nameInput.value.trim();
      const code = codeInput.value.trim();
      const dirName = dirInput.value.trim();

      if (!name || !code || !dirName) return;

      // Disable form inputs
      nameInput.disabled = true;
      codeInput.disabled = true;
      dirInput.disabled = true;
      submitBtn.disabled = true;

      // Show progress
      document.getElementById('progressContainer').style.display = 'block';

      // Step 1: Init Tenant & Folder
      setStepState('step1', 'step-active');
      google.script.run
        .withSuccessHandler((r1) => {
          if (!r1.success) {
            handleError('step1', r1.message);
            return;
          }
          setStepState('step1', 'step-success');
          document.getElementById('step1Text').innerText = 'Step 1: Registered in sheet & created folder: "' + r1.folderName + '"';

          // Step 2: Copy App template
          setStepState('step2', 'step-active');
          google.script.run
            .withSuccessHandler((r2) => {
              if (!r2.success) {
                handleError('step2', r2.message);
                return;
              }
              setStepState('step2', 'step-success');
              document.getElementById('step2Text').innerText = 'Step 2: Copied App template (ID: ' + r2.appFileId + ')';

              // Step 3: Create remaining sheets
              setStepState('step3', 'step-active');
              google.script.run
                .withSuccessHandler((r3) => {
                  if (!r3.success) {
                    handleError('step3', r3.message);
                    return;
                  }
                  setStepState('step3', 'step-success');
                  document.getElementById('step3Text').innerText = 'Step 3: Created Master, Operations, Accounts, Views, and Reports files.';

                  // Show results
                  showResults(r3);
                })
                .withFailureHandler((err) => {
                  handleError('step3', err.message || err);
                })
                .onboardStep3_createRemainingSheets(r1.folderId, r2.appFileId);
            })
            .withFailureHandler((err) => {
              handleError('step2', err.message || err);
            })
            .onboardStep2_copyAppTemplate(r1.folderId);
        })
        .withFailureHandler((err) => {
          handleError('step1', err.message || err);
        })
        .onboardStep1_initTenant(name, code, dirName);
    }

    function handleError(stepId, message) {
      setStepState(stepId, 'step-error');
      const errBox = document.getElementById('errorBox');
      errBox.style.display = 'block';
      errBox.innerText = 'Error: ' + message;
      
      // Re-enable inputs
      nameInput.disabled = false;
      codeInput.disabled = false;
      dirInput.disabled = false;
      submitBtn.disabled = false;
    }

    function showResults(data) {
      const resultsBox = document.getElementById('resultsBox');
      const list = document.getElementById('resultsList');
      list.innerHTML = `
        <li><strong>App ID:</strong> ${data.appFileId}</li>
        <li><strong>Master ID:</strong> ${data.masterFileId}</li>
        <li><strong>Operations ID:</strong> ${data.operationFileId}</li>
        <li><strong>Accounts ID:</strong> ${data.accountsFileId}</li>
        <li><strong>Views ID:</strong> ${data.viewsFileId}</li>
        <li><strong>Reports ID:</strong> ${data.reportsFileId}</li>
      `;
      resultsBox.style.display = 'block';
      
      // Hide form
      document.getElementById('formContainer').style.display = 'none';
    }
  </script>
</body>
</html>
